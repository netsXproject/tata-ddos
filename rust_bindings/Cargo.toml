[package]
name = "tata_rust"
version = "1.1.0"
edition = "2021"
authors = ["nezX <nezx@protonmail.com>"]
description = "Rust core for TaTa DDoS - High-performance attack primitives"
repository = "https://github.com/nezX-project/tata-ddos"
license = "MIT"
readme = "README.md"

[lib]
name = "tata_rust"
crate-type = ["cdylib"]  # Creates a shared library for Python

[dependencies]
# Python bindings
pyo3 = { version = "0.20.0", features = ["extension-module"] }

# Async runtime
tokio = { version = "1.35.0", features = ["full"] }

# Random generation
rand = "0.8.5"

# Networking
socket2 = "0.5.5"
trust-dns-resolver = "0.23.2"  # For DNS resolution

# TLS (for ghost handshake)
rustls = "0.21.7"
webpki = "0.22.0"
webpki-roots = "0.25.2"

# Logging (optional, for debugging)
log = "0.4.20"
env_logger = "0.10.0"

# Error handling
anyhow = "1.0.75"
thiserror = "1.0.50"

[build-dependencies]
pyo3-build-config = "0.20.0"

[profile.release]
lto = true          # Link-time optimization for smaller/faster binary
codegen-units = 1   # Better optimization at compile time cost
strip = true        # Remove debug symbols (smaller binary)
opt-level = 3       # Maximum optimization

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
